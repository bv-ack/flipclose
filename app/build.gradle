plugins { id 'com.android.application' }

def vCode = (project.findProperty('vCode') ?: '1') as int

android {
    namespace 'com.flipclose'
    compileSdk 34
    defaultConfig {
        applicationId 'com.flipclose'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "0.${vCode}"
    }
    signingConfigs {
        release {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KS_ALIAS')
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            // Own key when secrets exist, otherwise the debug key so the APK still installs.
            signingConfig(System.getenv('KS_FILE') ? signingConfigs.release : signingConfigs.debug)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
